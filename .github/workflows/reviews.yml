name: Google vélemények frissítése

# Best-effort daily refresh. The scraper exits 0 whether or not it finds
# anything, so a failed run leaves content/reviews.json untouched and this
# workflow stays green — see the header comment in scripts/scrape-reviews.ts
# for why a free, keyless scrape cannot be guaranteed.
on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Chromium telepítése
        run: npx playwright install --with-deps chromium

      - name: Vélemények lekérése
        run: npm run reviews:scrape

      - name: Változás commitolása
        run: |
          if git diff --quiet -- content/reviews.json; then
            echo "Nincs új vélemény." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/reviews.json
          git commit -m "chore: update google reviews"
          git push
          echo "Új vélemény érkezett, a deploy elindult." >> "$GITHUB_STEP_SUMMARY"
